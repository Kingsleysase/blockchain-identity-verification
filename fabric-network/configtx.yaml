Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: crypto-config/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"

  - &IdentityAuthority
    Name: IdentityAuthorityMSP
    ID: IdentityAuthorityMSP
    MSPDir: crypto-config/peerOrganizations/identityauthority.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('IdentityAuthorityMSP.admin', 'IdentityAuthorityMSP.peer', 'IdentityAuthorityMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('IdentityAuthorityMSP.admin', 'IdentityAuthorityMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('IdentityAuthorityMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('IdentityAuthorityMSP.peer')"

  - &Bank
    Name: BankMSP
    ID: BankMSP
    MSPDir: crypto-config/peerOrganizations/bank.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankMSP.admin', 'BankMSP.peer', 'BankMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankMSP.admin', 'BankMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankMSP.peer')"

  - &Telecom
    Name: TelecomMSP
    ID: TelecomMSP
    MSPDir: crypto-config/peerOrganizations/telecom.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('TelecomMSP.admin', 'TelecomMSP.peer', 'TelecomMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('TelecomMSP.admin', 'TelecomMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('TelecomMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('TelecomMSP.peer')"

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.example.com:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  ThreeOrgsOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      IdentityConsortium:
        Organizations:
          - *IdentityAuthority
          - *Bank
          - *Telecom

  ThreeOrgsChannel:
    Consortium: IdentityConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *IdentityAuthority
        - *Bank
        - *Telecom
